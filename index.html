<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dragon &amp; Bard</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- INTRO -->
<section id="intro" class="screen">
  <h1 id="introTitle">Dragon &amp; Bard</h1>
  <div id="introDragon"></div>
  <div class="small">Write your dragon name with your finger or pencil</div>
  <div id="sigWrap"><canvas id="sig"></canvas></div>
  <div class="row">
    <button class="btn ghost" id="sigClear">Clear</button>
    <input id="typedName" placeholder="Name (grown-up can type)" maxlength="16" autocomplete="off">
    <button class="btn fire" id="startBtn">Start the adventure!</button>
  </div>
</section>

<!-- MAP -->
<section id="map" class="screen">
  <div class="topbar">
    <canvas id="sigSmall" width="160" height="50" style="height:38px;width:122px;background:#fffaf0;border-radius:8px"></canvas>
    <span id="playersStrip"></span>
    <span class="grp"><span class="glabel">Badges</span>
      <span class="pill" title="Wizard badges">🔮 <span id="bWiz">0</span></span>
      <span class="pill" title="Scholar badges">📜 <span id="bSch">0</span></span>
      <span class="pill" title="Quill points">🪶 <span id="bQuill">0</span></span></span>
    <span class="grp"><span class="glabel">Comrades</span>
      <span class="pill" title="Shield guards">🛡️ <span id="bProt">0</span></span>
      <span class="pill" title="Archers">🏹 <span id="bArch">0</span></span>
      <span class="pill" title="Ghost friends (help with clocks)" id="ghostPill" style="display:none">👻 <span id="bGhost">0</span></span></span>
    <span class="grp resting" id="restGrp"><span class="glabel">Resting ⛺</span>
      <span class="pill" id="restProtPill"><span class="zz">🛡️</span>💤 <span id="rProt">0</span></span>
      <span class="pill" id="restArchPill"><span class="zz">🏹</span>💤 <span id="rArch">0</span></span>
      <span class="pill" id="restGhostPill"><span class="zz">👻</span>💤 <span id="rGhost">0</span></span></span>
    <button class="btn gold" id="trainBtn" style="display:none;font-size:18px;min-height:44px;padding:8px 14px">🏹 Train archer (3 🛡️)</button>
    <span class="spacer"></span>
    <button class="btn" id="playersBtn" title="Players" style="min-height:44px;padding:6px 14px;font-size:24px">👥</button>
    <button class="btn" id="wardrobeBtn" title="Wardrobe" style="min-height:44px;padding:6px 14px;font-size:26px">👗</button>
    <button class="btn ghost" id="resetBtn" title="Start over" style="min-height:44px;padding:8px 14px">⟲</button>
  </div>
  <div id="mapArea"><svg id="mapSvg" viewBox="0 0 1400 700" preserveAspectRatio="xMidYMid meet"></svg></div>
</section>

<!-- WARDROBE -->
<section id="wardrobe" class="screen">
  <div class="row" style="width:100%"><h2>Wardrobe</h2><span class="spacer"></span><button class="btn" id="wardrobeBack">Back to map</button></div>
  <div class="row">
    <div id="wDragon"></div>
    <div id="wBard"></div>
  </div>
  <div class="small">Dragon colours</div>
  <div class="swatches" id="dragonSwatches"></div>
  <div class="small" id="bardHatLabel">Bard hats</div>
  <div class="swatches" id="hatSwatches"></div>
</section>

<!-- Encounter modules add their screens here -->
<div id="stage"></div>

<div id="overlay"><div id="overlayBox"></div></div>
<div id="bard"><div id="bardSvg"></div><div id="bubble"></div></div>

<script src="js/core.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/quill.js"></script>
<script src="js/modules/duel.js"></script>
<script src="js/modules/wordsearch.js"></script>
<script src="js/modules/rhyme.js"></script>
<script src="js/modules/clock.js"></script>
<script src="js/modules/scribe.js"></script>
<script src="js/modules/mystery.js"></script>
<script src="js/modules/lilypad.js"></script>
<script src="js/modules/addigator.js"></script>
<script src="js/modules/mozzies.js"></script>
<script src="js/game.js"></script>
</body>
</html>
